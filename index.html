<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Bounce</title>
<style>
  :root {
    --bg: #0d1424;
    --panel: #16203a;
    --ink: #e6ecff;
    --muted: #8b97b8;
    --accent: #ff4d6d;
    --good: #3ddc97;
    --gold: #ffc857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 16px;
  }
  .wrap { width: 100%; max-width: calc((100vh - 170px) * 1.6); min-width: 320px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .level-name { color: var(--muted); flex: 1; min-width: 160px; }
  .level-name b { color: var(--ink); }
  .dots { display: flex; gap: 6px; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3a4770;
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0;
  }
  .dot.done { border-color: var(--good); color: var(--good); }
  .dot.current { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dot:disabled { opacity: .35; cursor: not-allowed; }
  canvas {
    display: block; width: 100%; height: auto; border-radius: 10px;
    background: #0a1020; box-shadow: 0 0 0 1px #26315a; touch-action: none;
  }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  button.tool {
    background: var(--panel); color: var(--ink); border: 1px solid #2c3a66; border-radius: 8px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button.tool:hover:not(:disabled) { border-color: #5468a8; }
  button.tool:disabled { opacity: .4; cursor: not-allowed; }
  button.tool.on { border-color: var(--gold); color: var(--gold); }
  .count { margin-left: auto; color: var(--muted); }
  .count b { color: var(--ink); }
  .help { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .hint { color: var(--gold); font-size: 14px; margin-top: 4px; min-height: 1.4em; }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5, 8, 18, .55);
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--panel); border: 1px solid #2c3a66; border-radius: 14px; padding: 24px 32px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .card h2 { margin: 0 0 6px; color: var(--good); }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .card button { font-size: 16px; padding: 8px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laser <span>Bounce</span></h1>
    <div class="level-name" id="levelName"></div>
    <div class="dots" id="dots"></div>
  </header>

  <canvas id="board" width="960" height="600"></canvas>

  <div class="bar">
    <button class="tool" id="rotL" title="Rotate selected mirror (Q)">⟲ Rotate</button>
    <button class="tool" id="rotR" title="Rotate selected mirror (E)">⟳ Rotate</button>
    <button class="tool" id="remove" title="Remove selected mirror (Delete)">Remove</button>
    <button class="tool" id="angles" title="Show bounce angles (A)">Show angles</button>
    <button class="tool" id="reset" title="Reset level (R)">Reset</button>
    <button class="tool" id="solve">Show solution</button>
    <div class="count" id="count"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="help">
    Click an empty spot to place a mirror. Drag to move it. Scroll, or press Q / E, to rotate.
    Right-click removes it. Mirrors with a pin can only rotate. Light every target to win.
  </div>
</div>

<div class="overlay" id="win">
  <div class="card">
    <h2 id="winTitle">Target hit!</h2>
    <p id="winText"></p>
    <button class="tool" id="next">Next level →</button>
  </div>
</div>

<script>
// ---------- Geometry helpers ----------
// A point or direction is {x, y}. Angles are in degrees.
// On a screen, y grows downward, so 0° = right, 90° = down, 180° = left, 270° = up.
const rad = d => d * Math.PI / 180;
const dirOf = a => ({ x: Math.cos(rad(a)), y: Math.sin(rad(a)) });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });

// Where does a ray (start p, direction d) cross the line segment a–b?
// Returns the distance t along the ray, or null if it misses.
function raySegment(p, d, a, b) {
  const s = sub(b, a);
  const denom = cross(d, s);
  if (Math.abs(denom) < 1e-9) return null;   // parallel: never meet
  const ap = sub(a, p);
  const t = cross(ap, s) / denom;            // how far along the ray
  const u = cross(ap, d) / denom;            // how far along the segment (0..1)
  return (t > 1e-6 && u >= 0 && u <= 1) ? t : null;
}

// Does the ray pass through a circle (a target) before distance maxT?
function rayCircle(p, d, c, r, maxT) {
  const f = sub(p, c);
  const b = dot(f, d);
  const disc = b * b - (dot(f, f) - r * r);
  if (disc < 0) return false;
  const t1 = -b - Math.sqrt(disc), t2 = -b + Math.sqrt(disc);
  return t2 > 0 && t1 < maxT;
}

// The mirror rule: "angle in = angle out".
// Flip the part of the direction that points into the mirror (along its normal n).
function reflect(d, n) {
  const k = 2 * dot(d, n);
  return { x: d.x - k * n.x, y: d.y - k * n.y };
}

// ---------- Levels ----------
// laser: start point and direction. walls: [x1, y1, x2, y2]. pinned: mirrors that only rotate.
// mirrors: how many free mirrors you may place. solution: one way to solve it.
const LEVELS = [
  {
    name: "First bounce",
    hint: "A mirror tilted 45° turns the beam by 90°.",
    laser: { x: 80, y: 120, a: 0 },
    targets: [[720, 480]],
    walls: [],
    pinned: [],
    mirrors: 1,
    solution: { free: [[720, 120, 45]], pinned: [] }
  },
  {
    name: "Over the wall",
    hint: "Go up, over, and back down.",
    laser: { x: 80, y: 300, a: 0 },
    targets: [[720, 440]],
    walls: [[480, 140, 480, 600]],
    pinned: [],
    mirrors: 3,
    solution: { free: [[240, 300, 135], [240, 80, 135], [720, 80, 45]], pinned: [] }
  },
  {
    name: "Rotate only",
    hint: "These mirrors are pinned in place. Just turn them.",
    laser: { x: 80, y: 540, a: 270 },
    targets: [[880, 100]],
    walls: [[680, 0, 680, 440]],
    pinned: [{ x: 80, y: 100, a: 0 }, { x: 480, y: 100, a: 90 }, { x: 480, y: 500, a: 0 }, { x: 880, y: 500, a: 90 }],
    mirrors: 0,
    solution: { free: [], pinned: [135, 45, 45, 135] }
  },
  {
    name: "Two at once",
    hint: "The beam passes straight through targets. Light both with one beam.",
    laser: { x: 80, y: 80, a: 0 },
    targets: [[880, 300], [480, 520]],
    walls: [[320, 180, 640, 180], [640, 180, 640, 420], [640, 420, 320, 420], [320, 420, 320, 180]],
    pinned: [],
    mirrors: 2,
    solution: { free: [[880, 80, 45], [880, 520, 135]], pinned: [] }
  },
  {
    name: "Steep angle",
    hint: "Not every bounce is 90°. Try mirrors at 30° or 60° steps.",
    laser: { x: 80, y: 520, a: 0 },
    targets: [[640, 104]],
    walls: [[560, 300, 720, 300]],
    pinned: [],
    mirrors: 1,
    solution: { free: [[400, 520, 150]], pinned: [] }
  },
  {
    name: "Zigzag",
    hint: "Snake through the gaps.",
    laser: { x: 60, y: 520, a: 0 },
    targets: [[840, 120]],
    walls: [[0, 440, 760, 440], [200, 260, 960, 260]],
    pinned: [],
    mirrors: 4,
    solution: { free: [[860, 520, 135], [860, 340, 45], [100, 340, 45], [100, 120, 135]], pinned: [] }
  },
  {
    name: "Triangle shot",
    hint: "Two mirrors, two targets. The straight-up route is blocked.",
    laser: { x: 80, y: 520, a: 0 },
    targets: [[600, 312], [304, 400]],
    walls: [[200, 460, 420, 460]],
    pinned: [],
    mirrors: 2,
    solution: { free: [[720, 520, 120], [480, 100, 0]], pinned: [] }
  },
  {
    name: "Grand finale",
    hint: "Turn the pinned mirror first, then build the rest of the path.",
    laser: { x: 480, y: 560, a: 270 },
    targets: [[100, 100], [860, 100]],
    walls: [[200, 200, 760, 200], [0, 420, 380, 420], [580, 420, 960, 420]],
    pinned: [{ x: 480, y: 300, a: 0 }],
    mirrors: 3,
    solution: { free: [[100, 300, 45], [100, 40, 135], [860, 40, 45]], pinned: [45] }
  }
];

// ---------- Game state ----------
const W = 960, H = 600;
const HALF = 30;          // half the length of a mirror
const SNAP = 20;          // mirrors snap to a 20-pixel grid
const STEP = 15;          // rotation step in degrees
const TARGET_R = 16;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let levelIndex = 0;
let mirrors = [];         // {x, y, a, pinned}
let selected = null;
let drag = null;
let showAngles = false;
let won = false;
let beam = null;          // result of the last trace
let completed = loadProgress();

function loadProgress() {
  try { return JSON.parse(localStorage.getItem("laserBounceDone") || "[]"); } catch { return []; }
}
function saveProgress() {
  try { localStorage.setItem("laserBounceDone", JSON.stringify(completed)); } catch {}
}
const level = () => LEVELS[levelIndex];
const freeUsed = () => mirrors.filter(m => !m.pinned).length;

function loadLevel(i) {
  levelIndex = i;
  const L = level();
  mirrors = L.pinned.map(p => ({ x: p.x, y: p.y, a: p.a, pinned: true }));
  selected = null; drag = null; won = false;
  document.getElementById("win").classList.remove("show");
  document.getElementById("hint").textContent = "Hint: " + L.hint;
  update();
}

// ---------- Tracing the beam ----------
function mirrorEnds(m) {
  const d = dirOf(m.a);
  return [{ x: m.x - d.x * HALF, y: m.y - d.y * HALF }, { x: m.x + d.x * HALF, y: m.y + d.y * HALF }];
}

function trace() {
  const L = level();
  const walls = L.walls.map(w => [{ x: w[0], y: w[1] }, { x: w[2], y: w[3] }]);
  // The edges of the board are walls too.
  walls.push([{ x: 0, y: 0 }, { x: W, y: 0 }], [{ x: W, y: 0 }, { x: W, y: H }],
             [{ x: W, y: H }, { x: 0, y: H }], [{ x: 0, y: H }, { x: 0, y: 0 }]);

  let p = { x: L.laser.x, y: L.laser.y };
  let d = dirOf(L.laser.a);
  const points = [p];
  const bounces = [];
  const hit = L.targets.map(() => false);
  let last = null;

  for (let step = 0; step < 60; step++) {
    // Find the closest thing the beam runs into.
    let best = Infinity, bestMirror = null;
    for (const [a, b] of walls) {
      const t = raySegment(p, d, a, b);
      if (t !== null && t < best) { best = t; bestMirror = null; }
    }
    for (const m of mirrors) {
      if (m === last) continue;
      const [a, b] = mirrorEnds(m);
      const t = raySegment(p, d, a, b);
      if (t !== null && t < best) { best = t; bestMirror = m; }
    }
    // Light any targets the beam passes on the way.
    L.targets.forEach((c, i) => {
      if (rayCircle(p, d, { x: c[0], y: c[1] }, TARGET_R, best)) hit[i] = true;
    });

    const q = { x: p.x + d.x * best, y: p.y + d.y * best };
    points.push(q);
    if (!bestMirror) break;           // hit a wall: the beam stops

    // Bounce. n is the mirror's normal: a line at 90° to the mirror.
    const md = dirOf(bestMirror.a);
    const n = { x: -md.y, y: md.x };
    const out = reflect(d, n);
    bounces.push({ at: q, inDir: d, outDir: out, n });
    p = q; d = out; last = bestMirror;
  }
  return { points, bounces, hit };
}

// ---------- Drawing ----------
function draw() {
  const L = level();
  ctx.clearRect(0, 0, W, H);

  // Faint grid
  ctx.strokeStyle = "rgba(120,140,200,0.07)";
  ctx.lineWidth = 1;
  for (let x = 40; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Walls
  ctx.strokeStyle = "#4a5578";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  for (const w of L.walls) { ctx.beginPath(); ctx.moveTo(w[0], w[1]); ctx.lineTo(w[2], w[3]); ctx.stroke(); }

  // Targets
  L.targets.forEach((c, i) => {
    const on = beam.hit[i];
    ctx.save();
    if (on) { ctx.shadowColor = "#3ddc97"; ctx.shadowBlur = 25; }
    ctx.fillStyle = on ? "#3ddc97" : "#1b2748";
    ctx.strokeStyle = on ? "#b9ffe0" : "#3ddc97";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c[0], c[1], TARGET_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(c[0], c[1], 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  });

  // Beam (a wide soft glow, then a thin bright core)
  for (const [width, color] of [[9, "rgba(255,77,109,0.25)"], [3, "#ff4d6d"], [1.2, "#ffd6de"]]) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round";
    ctx.beginPath();
    beam.points.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
    ctx.stroke();
  }

  if (showAngles) drawAngles();

  // Mirrors
  for (const m of mirrors) {
    const [a, b] = mirrorEnds(m);
    if (m === selected) {
      ctx.strokeStyle = "rgba(255,200,87,0.35)"; ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.strokeStyle = "#cfe3ff"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = "#7fa6e0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (m.pinned) {
      ctx.fillStyle = "#ffc857";
      ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    if (m === selected) {
      ctx.fillStyle = "#ffc857"; ctx.font = "12px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(((m.a % 180) + 180) % 180 + "°", m.x, m.y - 38);
    }
  }

  // Laser emitter
  const ld = dirOf(L.laser.a);
  ctx.save();
  ctx.translate(L.laser.x, L.laser.y);
  ctx.rotate(Math.atan2(ld.y, ld.x));
  ctx.fillStyle = "#2a3558"; ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-26, -12, 32, 24, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#ff4d6d";
  ctx.beginPath(); ctx.arc(6, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Draw the "angle in" and "angle out" at each bounce, measured from the normal.
function drawAngles() {
  ctx.save();
  ctx.font = "bold 12px system-ui";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const b of beam.bounces) {
    // Point the normal toward the side the beam came from.
    const n = dot(b.inDir, b.n) > 0 ? { x: -b.n.x, y: -b.n.y } : b.n;
    const back = { x: -b.inDir.x, y: -b.inDir.y };
    const angle = Math.round(Math.acos(Math.min(1, Math.abs(dot(b.inDir, b.n)))) * 180 / Math.PI);

    ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(255,200,87,0.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.at.x, b.at.y); ctx.lineTo(b.at.x + n.x * 50, b.at.y + n.y * 50); ctx.stroke();
    ctx.setLineDash([]);

    for (const v of [back, b.outDir]) {
      const a1 = Math.atan2(n.y, n.x), a2 = Math.atan2(v.y, v.x);
      let diff = a2 - a1;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      ctx.beginPath(); ctx.arc(b.at.x, b.at.y, 24, a1, a1 + diff, diff < 0); ctx.stroke();
      const mid = a1 + diff / 2;
      if (angle > 0) {
        ctx.fillStyle = "#ffc857";
        ctx.fillText(angle + "°", b.at.x + Math.cos(mid) * 40, b.at.y + Math.sin(mid) * 40);
      }
    }
  }
  ctx.restore();
}

// ---------- Update the page ----------
function update() {
  beam = trace();
  draw();

  const L = level();
  document.getElementById("levelName").innerHTML = `Level ${levelIndex + 1}: <b>${L.name}</b>`;
  document.getElementById("count").innerHTML = L.mirrors
    ? `Mirrors left: <b>${L.mirrors - freeUsed()}</b> of ${L.mirrors}`
    : "No free mirrors this level";

  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  LEVELS.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = "dot" + (completed.includes(i) ? " done" : "") + (i === levelIndex ? " current" : "");
    btn.textContent = i + 1;
    btn.disabled = i > 0 && !completed.includes(i - 1) && !completed.includes(i);
    btn.onclick = () => loadLevel(i);
    dots.appendChild(btn);
  });

  const sel = !!selected;
  document.getElementById("rotL").disabled = !sel;
  document.getElementById("rotR").disabled = !sel;
  document.getElementById("remove").disabled = !sel || selected.pinned;
  document.getElementById("angles").classList.toggle("on", showAngles);

  const allHit = beam.hit.every(Boolean);
  if (allHit && !won) {
    won = true;
    if (!completed.includes(levelIndex)) { completed.push(levelIndex); saveProgress(); }
    const last = levelIndex === LEVELS.length - 1;
    document.getElementById("winTitle").textContent = last ? "You beat every level!" : "Target hit!";
    document.getElementById("winText").textContent =
      `${beam.bounces.length} bounce${beam.bounces.length === 1 ? "" : "s"}. ` +
      (last ? "Angle in = angle out, every time." : "Ready for the next one?");
    document.getElementById("next").textContent = last ? "Play again" : "Next level →";
    setTimeout(() => { if (won) document.getElementById("win").classList.add("show"); }, 350);
    update(); // refresh the level dots
  } else if (!allHit) {
    won = false;
  }
}

// ---------- Mouse and keyboard ----------
function boardPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const snap = v => Math.round(v / SNAP) * SNAP;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function distToSegment(p, a, b) {
  const ab = sub(b, a);
  const t = clamp(dot(sub(p, a), ab) / dot(ab, ab), 0, 1);
  return Math.hypot(p.x - (a.x + ab.x * t), p.y - (a.y + ab.y * t));
}
function mirrorAt(p) {
  for (let i = mirrors.length - 1; i >= 0; i--) {
    const [a, b] = mirrorEnds(mirrors[i]);
    if (distToSegment(p, a, b) < 12) return mirrors[i];
  }
  return null;
}

function rotate(m, delta) {
  if (!m) return;
  m.a = ((m.a + delta) % 360 + 360) % 360;
  update();
}
function removeMirror(m) {
  if (!m || m.pinned) return;
  mirrors = mirrors.filter(x => x !== m);
  if (selected === m) selected = null;
  update();
}

canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const p = boardPos(e);
  const m = mirrorAt(p);
  if (m) {
    selected = m;
    if (!m.pinned) drag = { m, dx: m.x - p.x, dy: m.y - p.y };
  } else if (freeUsed() < level().mirrors) {
    const nm = { x: clamp(snap(p.x), SNAP, W - SNAP), y: clamp(snap(p.y), SNAP, H - SNAP), a: 45, pinned: false };
    mirrors.push(nm);
    selected = nm;
    drag = { m: nm, dx: 0, dy: 0 };
  } else {
    selected = null;
  }
  canvas.setPointerCapture(e.pointerId);
  update();
});

canvas.addEventListener("pointermove", e => {
  const p = boardPos(e);
  if (drag) {
    const nx = clamp(snap(p.x + drag.dx), SNAP, W - SNAP);
    const ny = clamp(snap(p.y + drag.dy), SNAP, H - SNAP);
    if (nx !== drag.m.x || ny !== drag.m.y) { drag.m.x = nx; drag.m.y = ny; update(); }
    canvas.style.cursor = "grabbing";
    return;
  }
  const m = mirrorAt(p);
  canvas.style.cursor = m ? (m.pinned ? "pointer" : "grab") : "crosshair";
});

canvas.addEventListener("pointerup", () => { drag = null; });

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  removeMirror(mirrorAt(boardPos(e)));
});

// Scrolling rotates. Touchpads send many tiny scroll events, so add them up first.
let wheelSum = 0;
canvas.addEventListener("wheel", e => {
  const m = mirrorAt(boardPos(e)) || selected;
  if (!m) return;
  e.preventDefault();
  selected = m;
  wheelSum += e.deltaY;
  if (Math.abs(wheelSum) >= 40) {
    rotate(m, wheelSum > 0 ? STEP : -STEP);
    wheelSum = 0;
  }
}, { passive: false });

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "q" || k === "arrowleft") rotate(selected, -STEP);
  else if (k === "e" || k === "arrowright") rotate(selected, STEP);
  else if (k === "delete" || k === "backspace") removeMirror(selected);
  else if (k === "r") loadLevel(levelIndex);
  else if (k === "a") { showAngles = !showAngles; update(); }
  else if (k === "enter" && won) document.getElementById("next").click();
});

document.getElementById("rotL").onclick = () => rotate(selected, -STEP);
document.getElementById("rotR").onclick = () => rotate(selected, STEP);
document.getElementById("remove").onclick = () => removeMirror(selected);
document.getElementById("angles").onclick = () => { showAngles = !showAngles; update(); };
document.getElementById("reset").onclick = () => loadLevel(levelIndex);
document.getElementById("solve").onclick = () => {
  const s = level().solution;
  mirrors.filter(m => m.pinned).forEach((m, i) => m.a = s.pinned[i]);
  mirrors = mirrors.filter(m => m.pinned).concat(s.free.map(([x, y, a]) => ({ x, y, a, pinned: false })));
  selected = null;
  update();
};
document.getElementById("next").onclick = () => {
  document.getElementById("win").classList.remove("show");
  loadLevel((levelIndex + 1) % LEVELS.length);
};
document.getElementById("win").addEventListener("click", e => {
  if (e.target.id === "win") e.currentTarget.classList.remove("show");
});

// Sharp drawing on high-resolution screens
const scale = window.devicePixelRatio || 1;
canvas.width = W * scale; canvas.height = H * scale;
ctx.scale(scale, scale);

// Start at the first level you haven't finished yet
const firstOpen = LEVELS.findIndex((_, i) => !completed.includes(i));
loadLevel(firstOpen === -1 ? 0 : firstOpen);
</script>
</body>
</html>
